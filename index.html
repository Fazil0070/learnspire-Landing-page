<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Learnspire - Empower your learning journey with an advanced learning management system offering course videos, assessments, results tracking, and more." />
    <meta name="keywords" content="Learnspire, learnspire.ai, learning management system, LMS, online learning, e-learning, educational platform" />
    <meta name="author" content="Learnspire" />

    <!-- SEO Meta Tags -->
    <meta property="og:title" content="Learnspire - Your Learning Companion" />
    <meta property="og:description" content="Explore Learnspire for a professional and user-friendly platform that transforms your learning experience." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://learnspire.ai/" />
    <meta property="og:image" content="/assets/og-image.jpg" />

    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Learnspire - Your Learning Companion" />
    <meta name="twitter:description" content="Transform your learning experience with Learnspire's advanced LMS platform." />
    <meta name="twitter:image" content="/assets/og-image.jpg" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/assets/favicon.png" />
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />

    <!-- Preload Critical Assets -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <title>Learnspire - Advanced Learning Management System</title>
    <link rel="canonical" href="https://learnspire.ai/" />

    <!-- Security Headers -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:;
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
      img-src 'self' data: https: blob:;
      font-src 'self' https://fonts.gstatic.com;
      connect-src 'self' https://api.learnspire.ai;
      frame-src 'self';
      media-src 'self';
      worker-src 'self' blob:;
      manifest-src 'self';">

    <meta http-equiv="content-type" content="nosniff">
    <meta http-equiv="x-ua-compatible" content="DENY">
    <meta http-equiv="content-security-policy" content="camera=(), microphone=(), geolocation=()">
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="text-align: center; padding: 20px;">
        You need to enable JavaScript to run this application.
        <br />
        Please enable JavaScript or switch to a browser that supports it.
      </div>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
