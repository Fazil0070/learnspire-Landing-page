server {
    listen 80;

    # Serve static files for your Vite app
    location / {
        root /usr/share/nginx/html;  # Directory where your Vite app's build files are located
        index index.html;
        try_files $uri $uri/ /index.html;  # Fallback to index.html for SPA routing
    }

    # Handle errors
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }

    # Handle 404s (missing pages)
    error_page 404 = @handle_404;

    location @handle_404 {
        root /usr/share/nginx/html;
        try_files /404.html @redirect_to_index;
        internal;
    }

    # Redirect to the index page on 404 (SPA fallback)
    location @redirect_to_index {
        return 302 /;
    }
}
