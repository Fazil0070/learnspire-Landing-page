nginx  
server {  
    listen 80;  
    server_name learnspire.ai www.learnspire.ai;  

    # Redirect HTTP to HTTPS  
    return 301 https://$server_name$request_uri;  
}  

server {  
    listen 443 ssl http2;  
    server_name learnspire.ai www.learnspire.ai;  

    ssl_certificate /path/to/your/certificate.crt;  
    ssl_certificate_key /path/to/your/private.key;  

    # SSL configuration  
    ssl_protocols TLSv1.2 TLSv1.3;  
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;  
    ssl_prefer_server_ciphers off;  

    # Root directory  
    root /var/www/learnspire/dist;  
    index index.html;  

    # Gzip compression  
    gzip on;  
    gzip_vary on;  
    gzip_min_length 10240;  
    gzip_proxied expired no-cache no-store private auth;  
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript;  
    gzip_disable "MSIE [1-6]\.";  

    # Brotli compression  
    brotli on;  
    brotli_types text/plain text/css application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript;  

    # Cache control  
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {  
        expires 30d;  
        add_header Cache-Control "public, no-transform";  
    }  

    # SPA configuration  
    location / {  
        try_files $uri $uri/ /index.html;  
        add_header X-Frame-Options "SAMEORIGIN";  
        add_header X-XSS-Protection "1; mode=block";  
        add_header X-Content-Type-Options "nosniff";  
        add_header Referrer-Policy "strict-origin-when-cross-origin";  
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://api.learnspire.ai;";  
    }  

    # Error pages  
    error_page 404 /index.html;  
    error_page 500 502 503 504 /50x.html;  
    location = /50x.html {  
        root /usr/share/nginx/html;  
    }  
}  